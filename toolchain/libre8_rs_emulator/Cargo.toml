[package]
name = "libre8-emulator"
version = "0.1.0"
edition = "2021"
authors = ["Elías A. Angulo Klein"]
description = "Libre8 Architecture Emulator - Pixel display and instruction execution"

[[bin]]
name = "emulator"
path = "emulator.rs"

[dependencies]
winit = "0.30.12"
glutin = { version = "0.32.3", features = ["egl"] }
glutin-winit = "0.5"
raw-window-handle = "0.6.2"
glow = "0.16.0"
once_cell = "1.19"
bytemuck = "1.15"
anyhow = "1.0"
minifb = "0.28.0"
lazy_static = "1.4"


[profile.dev]
opt-level = 0
debug = true
